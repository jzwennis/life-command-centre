<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Command Centre</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

    <!-- ── Dashboard ──────────────────────────────────────── -->
    <section id="dashboard" class="page-section active">
        <div class="glass-panel">
            <div class="title" id="datetime">Loading...</div>
            <div class="year-info">
                <div class="year-info-col">
                    <div class="year-info-label">Quarter</div>
                    <div class="year-info-value" id="currentQuarter">-</div>
                </div>
                <div class="year-info-col">
                    <div class="year-info-label">Days Left</div>
                    <div class="year-info-value" id="daysLeft">-</div>
                </div>
            </div>
            <blockquote class="quote">
                I am enough, I am not broken, I am evolving.
            </blockquote>
            <div class="button-wrap">
                <button class="glass-btn">
                    <span>Sync Dashboard</span>
                </button>
            </div>
        </div>
    </section>

    <!-- ── Projects ───────────────────────────────────────── -->
    <section id="projects" class="page-section">
        <div class="glass-panel page-card">
            <h2 class="page-title">Projects</h2>
            <div id="project-list"></div>
            <button class="add-btn" id="add-project-btn">+ Add Project</button>
            <div class="inline-form hidden" id="project-form">
                <input class="glass-input" type="text" id="project-name-input" placeholder="Project name…" autocomplete="off">
                <select class="glass-select" id="project-status-input">
                    <option value="active">Active</option>
                    <option value="on-hold">On Hold</option>
                    <option value="done">Done</option>
                </select>
                <input class="glass-input" type="text" id="project-desc-input" placeholder="Next action (optional)…" autocomplete="off">
                <div class="form-row">
                    <button class="glass-btn" id="save-project-btn"><span>Save</span></button>
                    <button class="ghost-btn" id="cancel-project-btn">Cancel</button>
                </div>
            </div>
        </div>
    </section>

    <!-- ── Goals ──────────────────────────────────────────── -->
    <section id="goals" class="page-section">
        <div class="glass-panel page-card" id="goals-container">
            <h2 class="page-title">Goals</h2>

            <div class="goal-group">
                <div class="goal-group-header">Year</div>
                <div class="goal-items" id="goals-year"></div>
                <button class="add-btn add-goal-btn" data-group="year">+ Add</button>
                <div class="inline-form hidden" id="goal-form-year">
                    <div class="form-row">
                        <input class="glass-input" type="text" id="goal-input-year" placeholder="Add a yearly goal…" autocomplete="off">
                        <button class="glass-btn save-goal-btn" data-group="year"><span>+</span></button>
                        <button class="ghost-btn cancel-goal-btn" data-group="year">✕</button>
                    </div>
                </div>
            </div>

            <div class="goal-group">
                <div class="goal-group-header">Quarter</div>
                <div class="goal-items" id="goals-quarter"></div>
                <button class="add-btn add-goal-btn" data-group="quarter">+ Add</button>
                <div class="inline-form hidden" id="goal-form-quarter">
                    <div class="form-row">
                        <input class="glass-input" type="text" id="goal-input-quarter" placeholder="Add a quarterly goal…" autocomplete="off">
                        <button class="glass-btn save-goal-btn" data-group="quarter"><span>+</span></button>
                        <button class="ghost-btn cancel-goal-btn" data-group="quarter">✕</button>
                    </div>
                </div>
            </div>

            <div class="goal-group">
                <div class="goal-group-header">Month</div>
                <div class="goal-items" id="goals-month"></div>
                <button class="add-btn add-goal-btn" data-group="month">+ Add</button>
                <div class="inline-form hidden" id="goal-form-month">
                    <div class="form-row">
                        <input class="glass-input" type="text" id="goal-input-month" placeholder="Add a monthly goal…" autocomplete="off">
                        <button class="glass-btn save-goal-btn" data-group="month"><span>+</span></button>
                        <button class="ghost-btn cancel-goal-btn" data-group="month">✕</button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- ── Bottom Nav ─────────────────────────────────────── -->
    <nav class="bottom-nav">
        <button class="nav-tab active" data-section="dashboard">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
            </svg>
            <span class="nav-label">Dashboard</span>
        </button>
        <button class="nav-tab" data-section="projects">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M20 6h-8l-2-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2z"/>
            </svg>
            <span class="nav-label">Projects</span>
        </button>
        <button class="nav-tab" data-section="goals">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm0-12c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm0 6c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/>
            </svg>
            <span class="nav-label">Goals</span>
        </button>
    </nav>

    <script>
        // ── Clock ─────────────────────────────────────────────
        function updateClock() {
            const now = new Date();
            const opts = { weekday: 'long', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' };
            document.getElementById('datetime').textContent = now.toLocaleDateString('en-ZA', opts);
            document.getElementById('currentQuarter').textContent = 'Q' + (Math.floor(now.getMonth() / 3) + 1);
            const end = new Date(now.getFullYear(), 11, 31);
            document.getElementById('daysLeft').textContent = Math.ceil((end - now) / 86400000);
        }
        setInterval(updateClock, 1000);
        updateClock();

        // ── Navigation ────────────────────────────────────────
        function showSection(id) {
            document.querySelectorAll('.page-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.querySelector(`.nav-tab[data-section="${id}"]`).classList.add('active');
        }
        document.querySelectorAll('.nav-tab').forEach(tab => {
            tab.addEventListener('click', () => showSection(tab.dataset.section));
        });

        // ── Helpers ───────────────────────────────────────────
        function esc(s) {
            return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        // ── Projects ──────────────────────────────────────────
        const ProjectStore = {
            key: 'lcc_projects',
            getAll() { return JSON.parse(localStorage.getItem(this.key) || '[]'); },
            save(d) { localStorage.setItem(this.key, JSON.stringify(d)); },
            add(name, status, desc) {
                const d = this.getAll();
                d.push({ id: Date.now(), name, status, desc });
                this.save(d);
            },
            remove(id) { this.save(this.getAll().filter(p => p.id !== id)); }
        };

        const statusLabels = { active: 'Active', 'on-hold': 'On Hold', done: 'Done' };

        function renderProjects() {
            const list = document.getElementById('project-list');
            const items = ProjectStore.getAll();
            if (!items.length) {
                list.innerHTML = '<p class="empty-msg">No projects yet.</p>';
                return;
            }
            list.innerHTML = items.map(p => `
                <div class="project-card">
                    <div class="project-info">
                        <div class="project-name">${esc(p.name)}</div>
                        ${p.desc ? `<div class="project-desc">${esc(p.desc)}</div>` : ''}
                    </div>
                    <div class="project-actions">
                        <span class="status-badge status-${p.status}">${statusLabels[p.status] || p.status}</span>
                        <button class="icon-btn delete-project" data-id="${p.id}">✕</button>
                    </div>
                </div>`).join('');
        }

        document.getElementById('add-project-btn').addEventListener('click', () => {
            document.getElementById('project-form').classList.remove('hidden');
            document.getElementById('add-project-btn').classList.add('hidden');
            document.getElementById('project-name-input').focus();
        });

        document.getElementById('cancel-project-btn').addEventListener('click', () => {
            document.getElementById('project-form').classList.add('hidden');
            document.getElementById('add-project-btn').classList.remove('hidden');
            document.getElementById('project-name-input').value = '';
            document.getElementById('project-desc-input').value = '';
        });

        document.getElementById('save-project-btn').addEventListener('click', () => {
            const name = document.getElementById('project-name-input').value.trim();
            if (!name) return;
            ProjectStore.add(
                name,
                document.getElementById('project-status-input').value,
                document.getElementById('project-desc-input').value.trim()
            );
            renderProjects();
            document.getElementById('cancel-project-btn').click();
        });

        document.getElementById('project-name-input').addEventListener('keydown', e => {
            if (e.key === 'Enter') document.getElementById('save-project-btn').click();
        });

        document.getElementById('project-list').addEventListener('click', e => {
            const btn = e.target.closest('.delete-project');
            if (btn) { ProjectStore.remove(Number(btn.dataset.id)); renderProjects(); }
        });

        // ── Goals ─────────────────────────────────────────────
        const GoalStore = {
            key: 'lcc_goals',
            getAll() { return JSON.parse(localStorage.getItem(this.key) || '[]'); },
            save(d) { localStorage.setItem(this.key, JSON.stringify(d)); },
            add(group, text) {
                const d = this.getAll();
                d.push({ id: Date.now(), group, text, done: false });
                this.save(d);
            },
            toggle(id) { this.save(this.getAll().map(g => g.id === id ? { ...g, done: !g.done } : g)); },
            remove(id) { this.save(this.getAll().filter(g => g.id !== id)); }
        };

        function renderGoals() {
            ['year', 'quarter', 'month'].forEach(group => {
                const el = document.getElementById(`goals-${group}`);
                const items = GoalStore.getAll().filter(g => g.group === group);
                el.innerHTML = items.length
                    ? items.map(g => `
                        <div class="goal-item${g.done ? ' done' : ''}">
                            <button class="goal-check" data-id="${g.id}">${g.done ? '✓' : '○'}</button>
                            <span class="goal-text">${esc(g.text)}</span>
                            <button class="icon-btn delete-goal" data-id="${g.id}">✕</button>
                        </div>`).join('')
                    : '<p class="empty-msg">Nothing added yet.</p>';
            });
        }

        document.querySelectorAll('.add-goal-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const g = btn.dataset.group;
                document.getElementById(`goal-form-${g}`).classList.remove('hidden');
                btn.classList.add('hidden');
                document.getElementById(`goal-input-${g}`).focus();
            });
        });

        document.querySelectorAll('.save-goal-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const g = btn.dataset.group;
                const input = document.getElementById(`goal-input-${g}`);
                const text = input.value.trim();
                if (!text) return;
                GoalStore.add(g, text);
                renderGoals();
                input.value = '';
                document.getElementById(`goal-form-${g}`).classList.add('hidden');
                document.querySelector(`.add-goal-btn[data-group="${g}"]`).classList.remove('hidden');
            });
        });

        document.querySelectorAll('.cancel-goal-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const g = btn.dataset.group;
                document.getElementById(`goal-input-${g}`).value = '';
                document.getElementById(`goal-form-${g}`).classList.add('hidden');
                document.querySelector(`.add-goal-btn[data-group="${g}"]`).classList.remove('hidden');
            });
        });

        ['year', 'quarter', 'month'].forEach(group => {
            document.getElementById(`goal-input-${group}`).addEventListener('keydown', e => {
                if (e.key === 'Enter') document.querySelector(`.save-goal-btn[data-group="${group}"]`).click();
            });
        });

        document.getElementById('goals-container').addEventListener('click', e => {
            const check = e.target.closest('.goal-check');
            if (check) { GoalStore.toggle(Number(check.dataset.id)); renderGoals(); return; }
            const del = e.target.closest('.delete-goal');
            if (del) { GoalStore.remove(Number(del.dataset.id)); renderGoals(); }
        });

        // ── Init ──────────────────────────────────────────────
        renderProjects();
        renderGoals();

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
